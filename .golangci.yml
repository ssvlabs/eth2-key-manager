version: "2"

linters:
  # On top of the default (standard) linter set.
  enable:
    - gosec
  exclusions:
    rules:
      # Like standalone gosec, skip tests: fixture keys and paths are expected there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
