name: Security check

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup make
        run: sudo apt-get update && sudo apt-get install make

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.21

      - name: Run gosec check
        run: make gosec
