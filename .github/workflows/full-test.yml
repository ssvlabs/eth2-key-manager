name: All tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.21"

      - name: Full-test
        run: make full-test
