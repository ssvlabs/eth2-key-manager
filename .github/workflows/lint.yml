name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          # Keep in sync with tool.mod's go directive: golangci-lint is built
          # from tool.mod via `go tool`.
          go-version: "1.25"
          cache: false

      - name: Restore Go cache (lint)
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-lint-${{ hashFiles('go.sum', 'tool.mod', 'tool.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-lint-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run make lint
        run: make lint
