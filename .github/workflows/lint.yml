name: Lint

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          # golangci-lint (pinned in tool.mod) needs Go >= 1.25 to build/run via
          # `go tool`. Keep in sync with tool.mod's go directive.
          go-version: "1.25"
          cache: false

      - name: Restore Go cache (lint)
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-lint-${{ hashFiles('go.sum', 'tool.mod', 'tool.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-lint-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run make lint
        run: make lint
